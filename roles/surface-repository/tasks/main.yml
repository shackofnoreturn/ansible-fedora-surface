---
- name: Gather Fedora facts
  ansible.builtin.setup:

- name: Determine Linux Surface repository release
  ansible.builtin.set_fact:
    surface_repository_selected_release: >-
      {{
        surface_repository_release
        if surface_repository_release | length > 0
        else
        surface_repository_fedora_mapping[
          ansible_facts['distribution_major_version']
        ]
        | default('')
      }}

- name: Display Linux Surface repository selection
  ansible.builtin.debug:
    msg:
      - "Installed Fedora: {{ ansible_facts['distribution_major_version'] }}"
      - "Linux Surface repository: Fedora {{ surface_repository_selected_release }}"

- name: Fail when no Linux Surface repository is defined
  ansible.builtin.assert:
    that:
      - surface_repository_selected_release | length > 0
    fail_msg: >-
      No Linux Surface repository mapping exists for Fedora
      {{ ansible_facts['distribution_major_version'] }}.

- name: Create Linux Surface repository configuration
  ansible.builtin.copy:
    dest: "{{ surface_repository_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [linux-surface]
      name=Linux Surface - Fedora {{ surface_repository_selected_release }}
      baseurl={{ surface_repository_base_url }}/f{{ surface_repository_selected_release }}/
      enabled=1
      gpgcheck=0
      metadata_expire=6h

- name: Refresh DNF metadata
  ansible.builtin.dnf:
    update_cache: true

- name: Check Linux Surface repository
  ansible.builtin.command:
    cmd: dnf repolist
  register: surface_repository_repolist
  changed_when: false

- name: Display Linux Surface repository
  ansible.builtin.debug:
    msg: "{{ surface_repository_repolist.stdout_lines }}"

- name: Query Surface kernel
  ansible.builtin.command:
    cmd: >-
      dnf repoquery
      --repoid=linux-surface
      --available
      --qf '%{name}-%{version}-%{release}.%{arch}'
      kernel-surface
  register: surface_repository_kernel_query
  changed_when: false
  failed_when: false

- name: Display Surface kernel availability
  ansible.builtin.debug:
    msg:
      - "Repository: Fedora {{ surface_repository_selected_release }}"
      - >-
        {{
          'kernel-surface is available from the Linux Surface repository.'
          if surface_repository_kernel_query.rc == 0
          else
          'kernel-surface is NOT available from the Linux Surface repository.'
        }}
      - "Packages:"
      - "{{ surface_repository_kernel_query.stdout_lines }}"
